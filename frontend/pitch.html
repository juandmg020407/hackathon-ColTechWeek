<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOmido · Pitch</title>
<meta name="theme-color" content="#00aedb">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pitch.css">
</head>
<body>
<main class="slide">
  <section class="demo">
    <span class="live"><i></i>Demo en vivo</span>
    <iframe src="index.html#lote" title="Lote El Rosal, en vivo" loading="eager"></iframe>
  </section>

  <footer class="foot">
    <audio id="pitch-audio" src="/pitch-audio.mp3" preload="auto"></audio>
    <button class="play" id="btn-play" aria-label="Reproducir el pitch narrado">▶ <span id="play-label">Pitch narrado · 1 min</span></button>
    <div class="bar" aria-hidden="true"><i id="bar-fill"></i></div>
    <span id="clock">0:00</span>
  </footer>
</main>

<script type="module">
// The audio drives the clock; if it cannot load, the button disables itself.
const audio = document.getElementById('pitch-audio');
const button = document.getElementById('btn-play');
const label = document.getElementById('play-label');
const fill = document.getElementById('bar-fill');
const clock = document.getElementById('clock');

const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function stop() {
  if (!audio.paused) audio.pause();
  button.firstChild.nodeValue = '▶ ';
  button.setAttribute('aria-label', 'Reproducir el pitch narrado');
}

function start() {
  button.firstChild.nodeValue = '❚❚ ';
  button.setAttribute('aria-label', 'Pausar el pitch narrado');
  const played = audio.play();
  if (played && typeof played.catch === 'function') played.catch(stop);
}

button.addEventListener('click', () => (audio.paused ? start() : stop()));
audio.addEventListener('timeupdate', () => {
  const total = audio.duration || 60;
  fill.style.width = `${(audio.currentTime / total) * 100}%`;
  clock.textContent = mmss(audio.currentTime);
});
audio.addEventListener('ended', () => { stop(); fill.style.width = '0'; clock.textContent = '0:00'; });
audio.addEventListener('loadedmetadata', () => {
  clock.textContent = mmss(0);
  label.textContent = `Pitch narrado · ${mmss(audio.duration)}`;
});
audio.addEventListener('error', () => {
  button.disabled = true;
  label.textContent = 'Audio pendiente — coloca pitch-audio.mp3';
  button.title = 'Falta frontend/pitch-audio.mp3';
});

document.addEventListener('keydown', (event) => {
  if (event.key === ' ' && !button.disabled) { event.preventDefault(); button.click(); }
});
</script>
</body>
</html>
