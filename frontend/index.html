<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOmido NPK 4.0 · Fertilidad por lote</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#00aedb">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"><div class="loading">Cargando el lote…</div></div>
<script>
  // En el despliegue la API sale del mismo origen y api.js la resuelve sola.
  // Aquí solo se apunta al backend de desarrollo, que corre en otro puerto.
  // Si no responde, api.js cae al paquete local: la app abre igual.
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port !== '8000') {
    window.NPK_API_BASE ??= 'http://127.0.0.1:8000';
  }
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
