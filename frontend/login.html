<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOmido NPK 4.0 · Entrar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#00aedb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="curtain" aria-hidden="true"></div>

<main class="screen">
  <div class="panel">
    <div class="brand">
      <div class="mark">iO</div>
      <div class="word">IOmido<small>NPK 4.0</small></div>
    </div>

    <h1 class="tagline">Tu lote, <em>medido de verdad</em>.</h1>
    <p class="prompt">Entra para ver el mapa de fertilidad de tu terreno.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="user">Usuario</label>
        <div class="wrap">
          <input id="user" name="user" type="text" autocomplete="username" placeholder="tu usuario" required>
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>

      <p class="error" id="error" role="alert" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <span id="error-text"></span>
      </p>

      <button class="submit" id="submit" type="submit">
        <span id="submit-label">Entrar al mapa</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <p style="text-align:center;font-size:.82rem;color:var(--muted)">
        ¿No tienes cuenta? <a class="switch" href="register.html">Regístrate</a>
      </p>

      <div class="aside">
        <a href="pitch.html">Ver el pitch</a>
        <span class="badge" id="mode">—</span>
      </div>
    </form>
  </div>
</main>

<script type="module">
import { paintField } from '/lib/field-background.js';
import { signIn, usingMock } from '/lib/auth.js';

document.getElementById('mode').textContent = usingMock ? 'Demo · sin backend' : 'Backend conectado';
paintField(document.getElementById('field'));

const form = document.getElementById('form');
const submit = document.getElementById('submit');
const submitLabel = document.getElementById('submit-label');
const errorBox = document.getElementById('error');
const errorText = document.getElementById('error-text');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (submit.disabled) return;
  errorBox.hidden = true;
  submit.disabled = true;
  submitLabel.textContent = 'Entrando…';

  try {
    await signIn({
      user: document.getElementById('user').value.trim(),
      password: document.getElementById('password').value,
    });
    window.location.href = 'index.html';
  } catch (error) {
    errorText.textContent = error.message;
    errorBox.hidden = false;
    submit.disabled = false;
    submitLabel.textContent = 'Entrar al mapa';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
